name: Deploy Next.js from jiroapp

on:
  push:
    branches: ["FrontBranch"]
    paths:
      - 'jiroapp/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # УБИРАЕМ defaults, чтобы все шаги работали из корня
    
    steps:
      - name: Checkout FrontBranch
        uses: actions/checkout@v4
        with:
          ref: FrontBranch
          fetch-depth: 0

      - name: Verify jiroapp exists
        run: |
          echo "Current directory: $(pwd)"
          echo "Listing files:"
          ls -la
          echo ""
          echo "Checking jiroapp folder..."
          if [ -d "jiroapp" ]; then
            echo "✅ jiroapp folder found"
            ls -la jiroapp/
            if [ -f "jiroapp/package.json" ]; then
              echo "✅ package.json found"
              cat jiroapp/package.json | grep -A5 -B5 "name\|version\|scripts"
            else
              echo "❌ package.json NOT found in jiroapp"
              exit 1
            fi
          else
            echo "❌ jiroapp folder not found"
            echo "Available directories:"
            find . -maxdepth 1 -type d | sort
            exit 1
          fi

      - name: Detect package manager
        id: detect-package-manager
        run: |
          cd jiroapp
          echo "Current directory for package detection: $(pwd)"
          if [ -f "yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            echo "Using Yarn"
          elif [ -f "pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=pnpm" >> $GITHUB_OUTPUT
            echo "Using pnpm"
          elif [ -f "package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            echo "Using npm"
          else
            echo "❌ No package manager files found"
            ls -la
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: jiroapp/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            jiroapp/.next/cache
            jiroapp/node_modules
          key: ${{ runner.os }}-nextjs-${{ hashFiles('jiroapp/package-lock.json') }}-${{ hashFiles('jiroapp/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('jiroapp/package-lock.json') }}-

      - name: Install dependencies
        run: |
          echo "Installing in jiroapp directory..."
          cd jiroapp
          npm ci --verbose
          echo "Dependencies installed"

      - name: Build Next.js
        run: |
          echo "Building Next.js app..."
          cd jiroapp
          npm run build --if-present || npx next build
          echo "Build completed"
        env:
          NODE_ENV: production
          # Если нужно для GitHub Pages:
          NEXT_PUBLIC_BASE_PATH: ""

      - name: Verify build output
        run: |
          echo "Checking build output..."
          if [ -d "jiroapp/out" ]; then
            echo "✅ Build output found in jiroapp/out/"
            echo "Files in out/:"
            ls -la jiroapp/out/
            echo ""
            echo "Looking for index.html..."
            if [ -f "jiroapp/out/index.html" ]; then
              echo "✅ index.html found"
              head -20 jiroapp/out/index.html
            else
              echo "❌ index.html not found"
              find jiroapp/out -name "*.html" -type f
            fi
          else
            echo "❌ No out directory found"
            echo "Checking for .next instead..."
            if [ -d "jiroapp/.next" ]; then
              echo "⚠️  .next found instead of out"
              echo "Check next.config.js for 'output: export'"
            fi
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: jiroapp/out/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
