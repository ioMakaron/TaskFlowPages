name: Deploy Next.js TypeScript App to GitHub Pages

on:
  push:
    branches: ["FrontBranch"]
    paths:
      - 'jiroapp/**'
      - '.github/workflows/**'
  pull_request:
    branches: ["FrontBranch"]
  
  workflow_dispatch:
    inputs:
      deploy_message:
        description: 'Deployment message'
        required: false
        default: 'Manual deployment triggered'
        type: string
      skip_type_check:
        description: 'Skip TypeScript type checking'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  type-check-and-lint:
    runs-on: ubuntu-latest
    
    if: ${{ !inputs.skip_type_check || github.event_name != 'workflow_dispatch' }}

    steps:
      - name: Checkout FrontBranch
        uses: actions/checkout@v4
        with:
          ref: FrontBranch

      - name: Verify project structure
        run: |
          echo "Current directory: $(pwd)"
          ls -la
          echo ""
          
          if [ ! -d "jiroapp" ]; then
            echo "Directory 'jiroapp' not found in root!"
            echo "Available directories:"
            ls -d */
            exit 1
          fi
          
          echo "✅ Found jiroapp directory"
          cd jiroapp
          
          if [ ! -f "package.json" ]; then
            echo "package.json not found in jiroapp/"
            ls -la
            exit 1
          fi
          
          echo "✅ Found package.json"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'pnpm'
          cache-dependency-path: 'jiroapp/pnpm-lock.yaml'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            jiroapp/node_modules
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('jiroapp/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: |
          cd jiroapp
          pnpm install --frozen-lockfile

      - name: TypeScript type checking
        if: ${{ !inputs.skip_type_check || github.event_name != 'workflow_dispatch' }}
        run: |
          cd jiroapp
          npx tsc --noEmit --skipLibCheck || echo "TypeScript check completed"
          
  build:
    runs-on: ubuntu-latest
    needs: type-check-and-lint

    steps:
      - name: Checkout FrontBranch
        uses: actions/checkout@v4
        with:
          ref: FrontBranch

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'pnpm'
          cache-dependency-path: 'jiroapp/pnpm-lock.yaml'

      - name: Restore cached dependencies
        uses: actions/cache@v4
        with:
          path: |
            jiroapp/node_modules
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('jiroapp/pnpm-lock.yaml') }}

      - name: Build Next.js TypeScript application
        run: |
          cd jiroapp
          NEXT_TELEMETRY_DISABLED=1 pnpm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BASE_PATH: ""

      - name: Configure output for GitHub Pages
        run: |
          cd jiroapp
          
          if [ -d "out" ]; then
            echo "Using existing 'out' directory"
          elif [ -d ".next" ]; then
            echo "Creating 'out' directory from .next"
            mkdir -p out
            # Копируем статику если есть
            if [ -d ".next/static" ]; then
              cp -r .next/static out/ 2>/dev/null || true
            fi
          else
            echo "Creating minimal 'out' directory"
            mkdir -p out
          fi
          
          # Создаем .nojekyll файл
          touch out/.nojekyll
          
          echo "artifact_path=jiroapp/out" >> $GITHUB_OUTPUT
        id: configure_output

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.configure_output.outputs.artifact_path }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Display deployment URL
        run: |
          echo "Deployment successful!"
          echo "URL: ${{ steps.deployment.outputs.page_url }}"
