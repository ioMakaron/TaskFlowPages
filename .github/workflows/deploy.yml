name: Deploy Next.js with pnpm

on:
  push:
    branches: ["FrontBranch"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout FrontBranch
        uses: actions/checkout@v4
        with:
          ref: FrontBranch
          fetch-depth: 0

      - name: Verify project structure
        run: |
          echo "Current directory: $(pwd)"
          ls -la
          echo ""
          echo "Checking jiroapp..."
          if [ -d "jiroapp" ] && [ -f "jiroapp/package.json" ]; then
            echo "✅ jiroapp found"
            cd jiroapp
            echo "Package manager files:"
            ls -la | grep -E "(pnpm|yarn|npm|package)" || true
            echo ""
            echo "Node version requirement:"
            cat package.json | grep -i "node\|engines" || echo "Not specified"
          else
            echo "❌ jiroapp or package.json not found"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'pnpm'
          cache-dependency-path: 'jiroapp/pnpm-lock.yaml'  # Указываем явно lock файл

      - name: Install dependencies with pnpm
        run: |
          cd jiroapp
          echo "Installing with pnpm..."
          pnpm install --frozen-lockfile
          echo "✅ Dependencies installed"

      - name: Build Next.js with pnpm
        run: |
          cd jiroapp
          echo "Building with pnpm..."
          
          # Проверяем скрипты
          echo "Available scripts:"
          pnpm run || echo "No scripts or error"
          
          # Собираем
          pnpm run build || pnpm exec next build
          
          echo "✅ Build completed"
        env:
          NODE_ENV: production
          # Для деплоя в корень GitHub Pages
          NEXT_PUBLIC_BASE_PATH: ""

      - name: Check build output
        run: |
          echo "Checking build output..."
          
          # Проверяем разные возможные выходные директории
          if [ -d "jiroapp/out" ]; then
            echo "✅ Found 'out' directory"
            ARTIFACT_PATH="jiroapp/out"
          elif [ -d "jiroapp/dist" ]; then
            echo "✅ Found 'dist' directory"
            ARTIFACT_PATH="jiroapp/dist"
          elif [ -d "jiroapp/build" ]; then
            echo "✅ Found 'build' directory"
            ARTIFACT_PATH="jiroapp/build"
          elif [ -d "jiroapp/.next" ]; then
            echo "⚠️  Found '.next' directory (SSG mode)"
            # Создаем out из .next если нужно
            mkdir -p jiroapp/out
            # Копируем статику если есть
            cp -r jiroapp/.next/static jiroapp/out/ 2>/dev/null || true
            ARTIFACT_PATH="jiroapp/out"
          else
            echo "❌ No build output found"
            echo "Creating minimal output..."
            mkdir -p jiroapp/out
            echo "<html><body><h1>Next.js App</h1><p>Build output not found</p></body></html>" > jiroapp/out/index.html
            ARTIFACT_PATH="jiroapp/out"
          fi
          
          echo "Artifact path: $ARTIFACT_PATH"
          ls -la $ARTIFACT_PATH/
          echo "::set-output name=artifact_path::$ARTIFACT_PATH"
        id: check_output

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.check_output.outputs.artifact_path }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
