name: Deploy Next.js

on:
  push:
    branches: ["FrontBranch"]
    paths:
      - 'jiroapp/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout FrontBranch
        uses: actions/checkout@v4
        with:
          ref: FrontBranch
          fetch-depth: 0

      - name: Verify jiroapp exists
        run: |
          echo "Current directory: $(pwd)"
          ls -la
          echo ""
          echo "Checking jiroapp..."
          if [ -d "jiroapp" ] && [ -f "jiroapp/package.json" ]; then
            echo "✅ jiroapp found with package.json"
            echo "Node version in package.json:"
            cat jiroapp/package.json | grep -i "node\|engines" || echo "No node version specified"
          else
            echo "❌ jiroapp or package.json not found"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" 
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'  # Ищем любой package-lock.json

      - name: Detect package manager
        id: detect-package-manager
        run: |
          cd jiroapp
          echo "Current dir: $(pwd)"
          if [ -f "yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            echo "Using Yarn"
          elif [ -f "package-lock.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            echo "Using npm (package-lock.json found)"
          elif [ -f "package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            echo "Using npm (no lock file)"
          else
            echo "❌ No package.json found"
            exit 1
          fi

      - name: Install dependencies
        run: |
          cd jiroapp
          echo "Installing dependencies..."
          if [ -f "yarn.lock" ]; then
            yarn install --frozen-lockfile
          elif [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi
          echo "✅ Dependencies installed"

      - name: Build Next.js
        run: |
          cd jiroapp
          echo "Building Next.js app..."
          # Проверяем доступные скрипты
          echo "Available scripts:"
          cat package.json | grep '"scripts"' -A 20 || true
          
          # Пробуем разные команды сборки
          if npm run | grep -q "build"; then
            npm run build
          else
            npx next build
          fi
          echo "✅ Build completed"
        env:
          NODE_ENV: production
          # Для GitHub Pages в корне
          NEXT_PUBLIC_BASE_PATH: ""

      - name: Verify build output
        run: |
          echo "Checking build output..."
          if [ -d "jiroapp/.next" ]; then
            echo "⚠️  .next directory found (SSG mode)"
            # Для SSG без export
            mkdir -p jiroapp/out
            cp -r jiroapp/.next/static jiroapp/out/ 2>/dev/null || true
            # Проверяем есть ли standalone
            if [ -d "jiroapp/.next/standalone" ]; then
              echo "✅ Next.js standalone output"
            fi
          fi
          
          if [ -d "jiroapp/out" ]; then
            echo "✅ out directory found"
            echo "Files:"
            ls -la jiroapp/out/
            if [ -f "jiroapp/out/index.html" ]; then
              echo "✅ index.html found"
            else
              echo "⚠️  index.html not found, checking for other HTML files..."
              find jiroapp/out -name "*.html" -type f
            fi
          else
            echo "❌ No out directory. Creating minimal static site..."
            mkdir -p jiroapp/out
            echo "<html><body><h1>Coming Soon</h1></body></html>" > jiroapp/out/index.html
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: jiroapp/out/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
