# Workflow for building and deploying a Next.js site from jiroapp folder to GitHub Pages root
name: Deploy Next.js

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["FrontBranch"]
    paths:
      - 'jiroapp/**'
      - '.github/workflows/deploy.yml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./jiroapp
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify jiroapp structure
        run: |
          echo "Checking jiroapp folder..."
          ls -la ./jiroapp/
          if [ ! -f "./jiroapp/package.json" ]; then
            echo "❌ Error: package.json not found in jiroapp folder"
            exit 1
          fi

      - name: Detect package manager
        id: detect-package-manager
        run: |
          cd ./jiroapp
          if [ -f "yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
          elif [ -f "pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=pnpm" >> $GITHUB_OUTPUT
            npm install -g pnpm
          elif [ -f "package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
          else
            echo "Unable to determine package manager"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
          cache-dependency-path: ./jiroapp/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          # Указываем, что используем static generator (Next.js export)
          static_site_generator: next

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ./jiroapp/.next/cache
            ./jiroapp/node_modules
          key: ${{ runner.os }}-nextjs-${{ hashFiles('./jiroapp/package-lock.json') }}-${{ hashFiles('./jiroapp/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('./jiroapp/package-lock.json') }}-

      - name: Install dependencies
        run: |
          cd ./jiroapp
          ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

      - name: Build Next.js for root deployment
        run: |
          cd ./jiroapp
          echo "Building for GitHub Pages root..."
          ${{ steps.detect-package-manager.outputs.runner }} next build
        env:
          # Важно: отключаем basePath для деплоя в корень
          NEXT_PUBLIC_BASE_PATH: ""
          NODE_ENV: production

      - name: Check build output
        run: |
          echo "Build output:"
          ls -la ./jiroapp/out/
          echo "Total files: $(find ./jiroapp/out -type f | wc -l)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Загружаем содержимое папки out напрямую (без вложенной папки)
          path: ./jiroapp/out/
          # name: github-pages  # Можно указать имя артефакта

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages root
        id: deployment
        uses: actions/deploy-pages@v4
